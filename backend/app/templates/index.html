<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepartoFacil - Delivery</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">🚚 RepartoFacil</div>
                <div class="nav-links">
                    <a href="/">Inicio</a>
                    <a href="#productos">Productos</a>
                    <a href="#contacto">Contacto</a>
                    <a href="/login" class="btn-login">Iniciar Sesión</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Tus pedidos, entregados rápido</h1>
                <p>La mejor selección de productos con delivery a domicilio</p>
                <a href="#productos" class="btn-primary">Ver Productos</a>
            </div>
        </section>

        <section id="productos" class="products">
            <div class="container">
                <h2>Nuestros Productos</h2>
                <div class="products-grid">
                    <!-- Los productos se cargarán dinámicamente -->
                    <div class="product-card">
                        <div class="product-image">📦</div>
                        <h3>Producto 1</h3>
                        <p class="price">$1000</p>
                        <button class="btn-add">Agregar al carrito</button>
                    </div>
                    <div class="product-card">
                        <div class="product-image">📦</div>
                        <h3>Producto 2</h3>
                        <p class="price">$1500</p>
                        <button class="btn-add">Agregar al carrito</button>
                    </div>
                    <div class="product-card">
                        <div class="product-image">📦</div>
                        <h3>Producto 3</h3>
                        <p class="price">$2000</p>
                        <button class="btn-add">Agregar al carrito</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 RepartoFacil. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
